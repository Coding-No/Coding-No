<svg fill="none" viewBox="0 0 880 260" width="880" height="260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Coding-No x Lala">
<defs>
    <clipPath id="bnShell">
        <rect x="0" y="0" width="880" height="260" rx="10"/>
    </clipPath>
    <linearGradient id="bnScanFade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
        <stop offset="50%" stop-color="#ffffff" stop-opacity="0.075"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
</defs>
<g clip-path="url(#bnShell)">
    <rect x="0" y="0" width="880" height="260" fill="#0c0c0e"/>
    <!-- grid samar ala terminal -->
    <g class="bn-grid" style="opacity:0.05" stroke="#34d399" stroke-width="1">
        <animate attributeName="opacity" values="0.03;0.07;0.03" dur="7.00s" repeatCount="indefinite"/>
        <line x1="66" y1="135" x2="814" y2="135"/>
        <line x1="66" y1="192" x2="528" y2="192" opacity="0.6"/>
    </g>

    <!-- bar chrome macOS: 3 dot, bernyala bergiliran -->
    <g class="bn-bar">
        <circle cx="82" cy="32" r="5.5" fill="#ff5f57" style="opacity:0">
            <animate attributeName="opacity" values="0.35;1;0.35" dur="1.80s" begin="0s" repeatCount="indefinite"/>
        </circle>
        <circle cx="99" cy="32" r="5.5" fill="#febc2e" style="opacity:0">
            <animate attributeName="opacity" values="0.35;1;0.35" dur="1.80s" begin="0.30s" repeatCount="indefinite"/>
        </circle>
        <circle cx="116" cy="32" r="5.5" fill="#28c840" style="opacity:0">
            <animate attributeName="opacity" values="0.35;1;0.35" dur="1.80s" begin="0.60s" repeatCount="indefinite"/>
        </circle>
        <!-- LED status berdenyut -->
        <circle class="bn-dot-led" cx="810" cy="32" r="4.5" fill="#34d399" style="opacity:0">
            <animate attributeName="opacity" values="0.25;1;0.25" dur="1.60s" repeatCount="indefinite"/>
            <animate attributeName="r" values="3.8;5.2;3.8" dur="1.60s" repeatCount="indefinite"/>
        </circle>
    </g>
    <line class="bn-hr" x1="0" y1="50" x2="880" y2="50" stroke="#ffffff" stroke-opacity="0.10"/>

    <!-- judul di baris pertama, menyala pelan -->
    <text class="bn-title" x="66" y="104" fill="#34d399" font-size="29" font-weight="600"
        font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" letter-spacing="-0.01em" style="opacity:0">Coding-No x Lala
        <animate attributeName="opacity" values="0.55;1;0.55" dur="7.00s" repeatCount="indefinite"/>
    </text>

    <!-- command line + kursor batang yang benar-benar terbaca -->
    <text class="bn-cmd" x="66" y="151" fill="#93c5fd" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        style="opacity:0" xml:space="preserve">$ Coding-No x Lala
        <animate attributeName="opacity" values="0.9;1;0.9" dur="2.40s" repeatCount="indefinite"/>
    </text>
    <rect class="bn-caret" x="260" y="135" width="9" height="20" fill="#93c5fd">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.00s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 0" dur="1.00s" repeatCount="indefinite"/>
    </rect>

    <text class="bn-sub" x="66" y="182" fill="#7dd3fc" font-size="15"
        font-family="ui-monospace,SFMono-Regular,Menlo,monospace" style="opacity:0" letter-spacing="0.06em">sawah tetap hijau
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2.40s"
          repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/></text>

    <!-- scanline turun pelan, plus bar kedip yang bikin gerak jelas terlihat -->
    <rect class="bn-scan" x="0" y="0" width="880" height="26"
        fill="url(#bnScanFade)" style="opacity:0">
        <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.85;1" dur="6.00s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 -31;0 260" dur="6.00s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    </rect>
    <rect class="bn-scanbar" x="0" y="78" width="880" height="2" fill="#34d399" style="opacity:0">
        <animate attributeName="opacity" values="0;0.22;0.22;0" keyTimes="0;0.1;0.9;1" dur="4.20s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 109;0 0" dur="4.20s" repeatCount="indefinite"/>
    </rect>
</g>
<!-- bingkai tipis di atas segalanya biar tepi tetap kebaca di tema terang -->
<rect class="bn-frame" x="0.5" y="0.5" width="879" height="259" rx="10"
    fill="none" stroke="#34d399" stroke-opacity="0.28"/>
</svg>